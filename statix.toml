disabled = [
  # W20 (repeated_keys) wants every repeated root key nested into one attrset.
  # That fights the house style of one flat `a.b.c = value;` line per setting --
  # which is what keeps the flake's inputs sortable, one input per entry. Off on
  # purpose, not a silent ignore: the lints that catch real mistakes are all on.
  "repeated_keys"
]
nix_version = '2.4'
ignore = ['.direnv']
