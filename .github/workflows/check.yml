name: check
on:
  push:
  pull_request:
  workflow_dispatch: # update-packages.yml runs it on its PR branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - run: nix flake check
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false # one broken host must not cancel the others
      matrix:
        include:
          - {host: abed, runner: ubuntu-latest}
          - {host: coltrane, runner: ubuntu-latest}
          - {host: dipper, runner: ubuntu-latest}
          - {host: duemmel, runner: ubuntu-24.04-arm}
          - {host: phil, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
