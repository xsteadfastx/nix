[default]
extend-ignore-re = [
	"(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",
	"(?s)//\\s*spellchecker:ignore-next-line[^\\n]*\\n[^\\n]*",
]

[default.extend-words]
mosquitto = "mosquitto"
therre = "therre"
hda = "hda"
abd = "abd" # ZFS ARC Buffered Data (abd_free, arc_hdr_free_abd, ...)
ba = "ba" # yt-dlp format selector (best audio)
ratatui = "ratatui" # ratatui-image, the TUI image crate

[default.extend-identifiers]
# Windows VM/interface name; typos splits identifiers on digits, so this was
# reported as a stray "nd".
w1nd50r = "w1nd50r"
